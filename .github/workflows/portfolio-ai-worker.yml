name: Deploy Portfolio AI Worker

on:
  push:
    branches: ["master"]
    paths:
      - "worker/**"
      - ".github/workflows/portfolio-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-ai-worker"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment skipped: required GitHub Actions secrets are not configured."
            exit 0
          fi
          npx wrangler@latest deploy --config worker/wrangler.toml
