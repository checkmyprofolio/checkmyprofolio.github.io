name: Deploy Portfolio AI Worker

on:
  push:
    branches: ["master"]
    paths:
      - "worker/**"
      - ".github/workflows/portfolio-ai-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-ai-worker"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          echo "Validating Cloudflare API token and inferring the accessible account..."
          npx wrangler@latest whoami
          npx wrangler@latest deploy --config worker/wrangler.toml
